name: ghost

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ghost
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ghost"]
      interval: 5s
      timeout: 5s
      retries: 10

  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ghost
      RUSTFS_SECRET_KEY: ghostsecret
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # console
    volumes:
      - rustfs:/data
      - rustfs_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:9000"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  bucket:
    image: amazon/aws-cli:latest
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ghost
      AWS_SECRET_ACCESS_KEY: ghostsecret
      AWS_DEFAULT_REGION: auto
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket ghost || aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket ghost"
    restart: "no"

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/ghost
    command: ["node", "packages/db/dist/migrate.js"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      bucket:
        condition: service_completed_successfully
      lgtm:
        condition: service_healthy
    environment:
      PORT: 3001
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
      PYROSCOPE_SERVER_ADDRESS: http://lgtm:4040
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/ghost
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-devsecretdevsecretdevsecret00000}
      BETTER_AUTH_URL: http://localhost:3001
      AUTH_TRUSTED_ORIGINS: http://localhost:3000
      S3_ENDPOINT: http://rustfs:9000
      S3_ACCESS_KEY_ID: ghost
      S3_SECRET_ACCESS_KEY: ghostsecret
      S3_BUCKET: ghost
    ports:
      - "3001:3001"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Baked into the browser bundle, so they have to be the host's URLs.
        NEXT_PUBLIC_API_URL: http://localhost:3001
        NEXT_PUBLIC_DOCS_URL: http://localhost:3003
    restart: unless-stopped
    depends_on:
      lgtm:
        condition: service_healthy

    environment:
      PORT: 3000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
      # The Next.js server is inside the network, where `localhost` is itself.
      INTERNAL_API_URL: http://api:3001
    ports:
      - "3000:3000"

  docs:
    build:
      context: .
      dockerfile: apps/docs/Dockerfile
      args:
        # Both are baked into the bundle, so they have to be the host's URLs.
        NEXT_PUBLIC_DOCS_URL: http://localhost:3003
        NEXT_PUBLIC_WEB_APP_URL: http://localhost:3000
    restart: unless-stopped
    environment:
      PORT: 3003
    ports:
      - "3003:3003"

  lgtm:
    image: grafana/otel-lgtm:latest
    restart: unless-stopped
    ports:
      - "3100:3000" # Grafana; 3000 is the web app's
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "4040:4040" # Pyroscope
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /otel-lgtm/grafana/conf/provisioning/dashboards/ghost/ghost.json
    volumes:
      - lgtm:/data
      - ./grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/ghost.yaml:ro
      - ./grafana/ghost.json:/otel-lgtm/grafana/conf/provisioning/dashboards/ghost/ghost.json:ro

volumes:
  postgres:
  lgtm:
  rustfs:
  rustfs_logs:
